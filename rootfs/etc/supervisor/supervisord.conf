; Prozesse im Container (ersetzt systemd). Alle Ausgaben gehen nach stdout des Containers.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; maillog_file = /dev/stdout: Postfix schreibt sein Log in die Pipe zu cm-journal.
; Nur cm-postfix das Signal schicken (nicht der ganzen Gruppe): es ruft "postfix stop" auf
; und braucht dafür cm-journal noch.
[program:postfix]
command=/usr/local/sbin/cm-postfix
priority=10
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=false
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Startet die systemd-Units der Pakete (User, ExecStartPre, ExecStart, EnvironmentFile)
[program:ciphermail-backend]
command=/usr/local/sbin/cm-run-unit ciphermail-backend
priority=20
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:ciphermail-portal-backend]
command=/usr/local/sbin/cm-run-unit ciphermail-portal-backend
priority=30
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:apache2]
command=/bin/bash -c '. /etc/apache2/envvars && mkdir -p "$APACHE_RUN_DIR" "$APACHE_LOCK_DIR" && rm -f "$APACHE_PID_FILE" && exec /usr/sbin/apache2 -DFOREGROUND'
priority=40
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Legt Rollen und Konten an, sobald das Backend antwortet. Bei Fehlern neuer Versuch.
[program:bootstrap]
command=/usr/local/sbin/cm-bootstrap
priority=50
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=100
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
